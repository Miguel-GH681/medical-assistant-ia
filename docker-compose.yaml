services:
  adminer:
    image: adminer:6.3.0
    ports:
      - 8081:8080

  postgres:
    image: postgres:18-alpine3.23
    container_name: medassistant-db
    environment:
      POSTGRES_DB: medassistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medassistant-data:/var/lib/postgresql/data

volumes:
  medassistant-data:
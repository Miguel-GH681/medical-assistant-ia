spring:
  application:
    name: medical-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/medassistant
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/medassistant